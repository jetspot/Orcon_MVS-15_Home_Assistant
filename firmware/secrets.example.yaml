# Kopieer dit bestand naar "secrets.yaml" (naast orconfanbox.yaml) en vul uw eigen gegevens in.
# Copy this file to "secrets.yaml" and fill in your own values.
# Kopieren Sie diese Datei nach "secrets.yaml" und tragen Sie Ihre eigenen Daten ein.

# Inlog van de webpagina / web page login / Anmeldung der Webseite
web_gebruiker: "admin"
web_wachtwoord: "admin"

# Wachtwoord voor draadloos bijwerken / OTA update password / OTA-Passwort
ota_password: "kies-een-ota-wachtwoord"

# Wachtwoord van het instelnetwerk "OrconFanBox Setup" (minimaal 8 tekens)
# Password of the setup network / Passwort des Einrichtungsnetzwerks
fallback_ap_password: "minimaal-8-tekens"

# Er staan GEEN wifi-gegevens in de firmware. U stelt uw wifi in via het
# instelnetwerk "OrconFanBox Setup" op http://192.168.4.1
# No Wi-Fi credentials are stored in the firmware; use the setup network.
# Es sind KEINE WLAN-Daten in der Firmware; nutzen Sie das Einrichtungsnetzwerk.
