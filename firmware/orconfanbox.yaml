interval:
  # v11.7: actuele tijd voor /grafiek.bin
  - interval: 1s
    then:
      - lambda: |-
          auto t = id(orcon_time).now();
          orc_nu() = t.is_valid() ? (uint32_t) t.timestamp : 0;
          orc_mem_tik(orc_nu());
          // v11.12: extra grafiekpunt bij elke verandering van de ventilatorsnelheid (min. 10 s ertussen)
          static int laatste = -1;
          static uint32_t laatst_t = 0;
          int sp = id(orcon_fan_speed).state ? id(orcon_fan_speed).speed : 0;
          if (laatste < 0) laatste = sp;
          if (t.is_valid() && sp != laatste && (uint32_t) t.timestamp - laatst_t >= 10) {
            float bl = id(orcon_humidity_baseline) < 0.0f ? NAN : id(orcon_humidity_baseline);
            orc_gr_add((uint32_t) t.timestamp, id(orcon_humidity).state, bl, (float) sp);
            laatst_t = (uint32_t) t.timestamp;
            laatste = sp;
          }
  # v11.7: elke 5 minuten een grafiekpunt in de flash (7 dagen)
  - interval: 5min
    startup_delay: 60s
    then:
      - lambda: |-
          float sp = id(orcon_fan_speed).state ? (float) id(orcon_fan_speed).speed : 0.0f;
          float bl = id(orcon_humidity_baseline) < 0.0f ? NAN : id(orcon_humidity_baseline);
          auto t = id(orcon_time).now();
          if (t.is_valid()) orc_gr_add((uint32_t) t.timestamp, id(orcon_humidity).state, bl, sp);
  - interval: 5s
    startup_delay: 20s
    then:
      - if:
          condition:
            lambda: |-
              return
                !isnan(id(orcon_humidity).state) &&
                id(orcon_humidity_baseline) < 0.0;
          then:
            - lambda: |-
                // v6: bewaarde baseline gebruiken als die geldig is
                float sb = id(orcon_baseline_saved);
                if (sb >= 10.0 && sb <= 95.0) {
                  id(orcon_humidity_baseline) = sb;
                } else {
                  id(orcon_humidity_baseline) =
                    id(orcon_humidity).state;
                }

                ESP_LOGI(
                  "orcon",
                  "Baseline ingesteld: %.1f%%",
                  id(orcon_humidity_baseline)
                );

      - if:
          condition:
            lambda: |-
              return id(orcon_humidity_boost_active);
          then:
            - lambda: |-
                id(orcon_humidity_boost_seconds) += 5;

                if (!isnan(id(orcon_humidity).state)) {
                  if (
                    id(orcon_humidity_peak) < 0.0 ||
                    id(orcon_humidity).state >
                    id(orcon_humidity_peak)
                  ) {
                    id(orcon_humidity_peak) =
                      id(orcon_humidity).state;
                  }
                }

      # v2: nafase na een boost - laagste punt bijhouden en
      # beeindigen zodra de badkamer weer normaal is
      - if:
          condition:
            lambda: |-
              return
                !id(orcon_humidity_boost_active) &&
                id(orcon_humidity_post_min) > 0.0 &&
                !isnan(id(orcon_humidity).state);
          then:
            - lambda: |-
                float rh = id(orcon_humidity).state;
                id(orcon_humidity_post_seconds) += 5;

                if (rh < id(orcon_humidity_post_min)) {
                  id(orcon_humidity_post_min) = rh;
                }

                if (
                  rh <=
                  id(orcon_humidity_baseline) +
                  id(orcon_humidity_rise_stop).state
                ) {
                  ESP_LOGI(
                    "orcon",
                    "Nafase klaar - RH %.1f%% weer bij baseline %.1f%%",
                    rh,
                    id(orcon_humidity_baseline)
                  );
                  id(orcon_humidity_post_min) = -1.0;
                  id(orcon_humidity_post_seconds) = 0;
                } else if (id(orcon_humidity_post_seconds) >= 5400) {
                  // 90 minuten later nog steeds vochtig (bijv. weer):
                  // baseline opnieuw bepalen
                  ESP_LOGI(
                    "orcon",
                    "Nafase 90 min voorbij - nieuwe baseline %.1f%%",
                    rh
                  );
                  id(orcon_humidity_baseline) = rh;
                  id(orcon_humidity_post_min) = -1.0;
                  id(orcon_humidity_post_seconds) = 0;
                }

      - if:
          condition:
            lambda: |-
              if (!id(orcon_humidity_auto).state) {
                return false;
              }

              if (id(orcon_humidity_boost_active)) {
                return false;
              }

              if (isnan(id(orcon_humidity).state)) {
                return false;
              }

              if (id(orcon_humidity_baseline) < 0.0) {
                return false;
              }

              float rh = id(orcon_humidity).state;

              // v2: in de nafase na een boost telt de stijging
              // vanaf het laagste punt (tweede douche)
              if (id(orcon_humidity_post_min) > 0.0) {
                return
                  rh - id(orcon_humidity_post_min) >=
                  id(orcon_humidity_rise_restart).state;
              }

              float verschil =
                rh -
                id(orcon_humidity_baseline);

              return
                verschil >=
                id(orcon_humidity_rise_start).state;
          then:
            - lambda: |-
                bool herstart = id(orcon_humidity_post_min) > 0.0;

                ESP_LOGI(
                  "orcon",
                  "VOCHT BOOST AAN%s - RH %.1f%% / baseline %.1f%% / rise %.1f%% / laagste na vorige boost %.1f%% / snelheid %.0f%%",
                  herstart ? " (tweede douche)" : "",
                  id(orcon_humidity).state,
                  id(orcon_humidity_baseline),
                  id(orcon_humidity).state -
                    id(orcon_humidity_baseline),
                  id(orcon_humidity_post_min),
                  id(orcon_humidity_speed).state
                );

                id(orcon_humidity_boost_active) = true;
                id(orcon_boost_doel) = orc_doel(
                  id(orcon_humidity).state - id(orcon_humidity_baseline),
                  id(orcon_humidity_rise_start).state, id(orcon_full_rise).state,
                  id(orcon_boost_min).state, id(orcon_humidity_speed).state, id(orcon_full_speed).state);

                id(orcon_humidity_peak) =
                  id(orcon_humidity).state;

                id(orcon_humidity_boost_seconds) = 0;
                id(orcon_humidity_stop_counter) = 0;
                id(orcon_humidity_post_min) = -1.0;
                id(orcon_humidity_post_seconds) = 0;

            - fan.turn_on:
                id: orcon_fan_speed
                speed: !lambda |-
                  if (id(orcon_remote_override) > 0) {
                    return id(orcon_remote_override);
                  }
                  if (id(orcon_boost_15m).is_running()) {
                    return 100;
                  }
                  return (id(orcon_var_boost).state && id(orcon_boost_doel) > 0 ? (int) lroundf(id(orcon_boost_doel)) : (int) id(orcon_humidity_speed).state);

      - if:
          condition:
            lambda: |-
              if (!id(orcon_humidity_auto).state) {
                return false;
              }

              if (!id(orcon_humidity_boost_active)) {
                return false;
              }

              float max_seconds =
                id(orcon_humidity_max_boost_minutes).state *
                60.0;

              if (
                id(orcon_humidity_boost_seconds) >=
                max_seconds
              ) {
                return true;
              }

              if (isnan(id(orcon_humidity).state)) {
                return false;
              }

              float rh = id(orcon_humidity).state;

              // v6: minimale boosttijd
              if (
                id(orcon_humidity_boost_seconds) <
                id(orcon_humidity_min_boost_minutes).state * 60.0
              ) {
                return false;
              }

              // v5: boost loopt door tot het vocht weer dicht bij de
              // baseline is (Peak_Drop wordt niet meer gebruikt)
              return
                rh <=
                (
                  id(orcon_humidity_baseline) +
                  id(orcon_humidity_boost_stop).state
                );
          then:
            - lambda: |-
                id(orcon_humidity_stop_counter)++;
          else:
            - lambda: |-
                id(orcon_humidity_stop_counter) = 0;

      - if:
          condition:
            lambda: |-
              return
                id(orcon_humidity_boost_active) &&
                id(orcon_humidity_stop_counter) >= 6;
          then:
            - lambda: |-
                ESP_LOGI(
                  "orcon",
                  "VOCHT BOOST UIT - RH %.1f%% / piek %.1f%% / baseline blijft %.1f%%",
                  id(orcon_humidity).state,
                  id(orcon_humidity_peak),
                  id(orcon_humidity_baseline)
                );

                id(orcon_humidity_boost_active) = false;
                id(orcon_humidity_stop_counter) = 0;
                id(orcon_humidity_boost_seconds) = 0;
                id(orcon_humidity_peak) = -1.0;
                id(orcon_boost_doel) = -1.0;

                // v2: baseline NIET meer op de (nog hoge) actuele
                // vochtigheid zetten. In plaats daarvan start een
                // nafase die een tweede douche herkent.
                if (
                  !isnan(id(orcon_humidity).state) &&
                  id(orcon_humidity).state >
                  id(orcon_humidity_baseline) +
                  id(orcon_humidity_rise_stop).state
                ) {
                  id(orcon_humidity_post_min) =
                    id(orcon_humidity).state;
                } else {
                  id(orcon_humidity_post_min) = -1.0;
                }
                id(orcon_humidity_post_seconds) = 0;

            - fan.turn_on:
                id: orcon_fan_speed
                speed: !lambda |-
                  if (id(orcon_remote_override) > 0) {
                    return id(orcon_remote_override);
                  }
                  if (id(orcon_boost_15m).is_running()) {
                    return 100;
                  }
                  return id(orcon_remote_override) > 0 ? id(orcon_remote_override) : (int) (id(orcon_night_active) ? id(orcon_night_speed).state : id(orcon_normal_speed).state);

      # v11: variabele boost - snelheid volgt de stijging
      - lambda: |-
          if (!id(orcon_humidity_boost_active) || !id(orcon_var_boost).state) return;
          if (id(orcon_remote_override) > 0 || id(orcon_boost_15m).is_running()) return;
          if (isnan(id(orcon_humidity).state) || id(orcon_humidity_baseline) < 0.0) return;
          float stijging = id(orcon_humidity).state - id(orcon_humidity_baseline);
          float doel = orc_doel(stijging, id(orcon_humidity_rise_start).state, id(orcon_full_rise).state,
                                id(orcon_boost_min).state, id(orcon_humidity_speed).state, id(orcon_full_speed).state);
          float cur = id(orcon_boost_doel);
          if (cur < 0 || doel >= cur) cur = doel;                 // harder: direct
          else cur = std::max(doel, cur - 5.0f / 12.0f);         // zachter: max 5% per minuut
          id(orcon_boost_doel) = cur;
          int sp = (int) lroundf(cur);
          if (id(orcon_fan_speed).state && id(orcon_fan_speed).speed != sp) {
            auto call = id(orcon_fan_speed).turn_on();
            call.set_speed(sp);
            call.perform();
            ESP_LOGI("orcon", "Variabele boost: stijging %.1f%% -> %d%%", stijging, sp);
          }

      # v11: instellingen in het opslagblok bijwerken (flash alleen bij wijziging)
      - lambda: |-
          if (!id(orc_klaar)) return;
          OrcOpslag d{};
          d.magic = ORC_MAGIC;
          esphome::number::Number *N[] = {id(orcon_normal_speed), id(orcon_boost_minutes), id(orcon_humidity_speed), id(orcon_humidity_rise_start), id(orcon_humidity_rise_stop), id(orcon_humidity_peak_drop), id(orcon_humidity_max_boost_minutes), id(orcon_humidity_rise_restart), id(orcon_humidity_boost_stop), id(orcon_humidity_min_boost_minutes), id(orcon_night_start), id(orcon_night_end), id(orcon_night_speed), id(orcon_low_speed), id(orcon_medium_speed), id(orcon_high_speed), id(orcon_remote_auto_us), id(orcon_remote_afwezig_us), id(orcon_remote_s1_us), id(orcon_remote_s2_us), id(orcon_remote_s3_us), id(orcon_remote_tolerance), id(orcon_boost_min), id(orcon_full_rise), id(orcon_full_speed)};
          for (int i = 0; i < 25; i++) d.num[i] = N[i]->state;
          d.schakel = (id(orcon_speed_bypass).state ? 1 : 0) | (id(orcon_humidity_auto).state ? 2 : 0) |
                      (id(orcon_night_mode).state ? 4 : 0) | (id(orcon_remote_control).state ? 8 : 0) |
                      (id(orcon_var_boost).state ? 16 : 0);
          d.baseline = id(orcon_baseline_saved);
          orc_pref().save(&d);

  # Baseline langzaam mee laten lopen (niet tijdens boost of nafase).
  # v2: dichtbij de baseline normaal (5%/min); verder erboven heel
  # langzaam (0,5%/min), zodat een douche niet wordt "opgegeten".
  - interval: 60s
    startup_delay: 60s
    then:
      - if:
          condition:
            lambda: |-
              return
                !isnan(id(orcon_humidity).state) &&
                !id(orcon_humidity_boost_active) &&
                id(orcon_humidity_post_min) < 0.0;
          then:
            - lambda: |-
                float rh = id(orcon_humidity).state;

                if (id(orcon_humidity_baseline) < 0.0) {
                  id(orcon_humidity_baseline) = rh;
                } else if (
                  rh <=
                  id(orcon_humidity_baseline) +
                  id(orcon_humidity_rise_stop).state
                ) {
                  id(orcon_humidity_baseline) =
                    (id(orcon_humidity_baseline) * 0.95) +
                    (rh * 0.05);
                } else {
                  id(orcon_humidity_baseline) =
                    (id(orcon_humidity_baseline) * 0.995) +
                    (rh * 0.005);
                }

  # v6: baseline elk uur bewaren (overleeft herstart en OTA)
  - interval: 3600s
    startup_delay: 600s
    then:
      - lambda: |-
          if (
            id(orcon_humidity_baseline) > 0.0 &&
            !id(orcon_humidity_boost_active) &&
            id(orcon_humidity_post_min) < 0.0 &&
            fabs(id(orcon_humidity_baseline) - id(orcon_baseline_saved)) >= 0.5
          ) {
            id(orcon_baseline_saved) = id(orcon_humidity_baseline);
            ESP_LOGI("orcon", "Baseline bewaard: %.1f%%", id(orcon_baseline_saved));
          }

  # v6: nachtstand
  - interval: 30s
    startup_delay: 30s
    then:
      - lambda: |-
          auto t = id(orcon_time).now();
          bool n = false;
          if (id(orcon_night_mode).state && t.is_valid()) {
            int h = t.hour;
            int s = (int) id(orcon_night_start).state;
            int e = (int) id(orcon_night_end).state;
            n = (s > e) ? (h >= s || h < e) : (h >= s && h < e);
          }
          if (n != id(orcon_night_active)) {
            int oud = (int) (id(orcon_night_active) ? id(orcon_night_speed).state : id(orcon_normal_speed).state);
            id(orcon_night_active) = n;
            ESP_LOGI("orcon", "Nachtstand %s", n ? "AAN" : "UIT");
            if (
              id(orcon_humidity_auto).state &&
              !id(orcon_humidity_boost_active) &&
              !id(orcon_boost_15m).is_running() &&
              id(orcon_remote_override) == 0 &&
              id(orcon_fan_speed).state &&
              id(orcon_fan_speed).speed == oud
            ) {
              auto call = id(orcon_fan_speed).turn_on();
              call.set_speed((int) (n ? id(orcon_night_speed).state : id(orcon_normal_speed).state));
              call.perform();
            }
          }

binary_sensor:
  - platform: template
    id: orcon_fan_failure
    name: "Orcon_Fan_Failure"
    device_class: problem
    web_server:
      sorting_group_id: grp_status
      sorting_weight: 1

    lambda: |-
      if (!id(orcon_fan_speed).state) {
        return false;
      }

      return id(orcon_tacho).state < 50.0;

    filters:
      - delayed_on: 30s
      - delayed_off: 10s

  - platform: template
    id: orcon_humidity_boost_status
    name: "Orcon_Humidity_Boost"
    web_server:
      sorting_group_id: grp_status
      sorting_weight: 3
    icon: "mdi:shower"

    lambda: |-
      return id(orcon_humidity_boost_active);

text_sensor:
  - platform: template
    name: "Orcon_Fan_Status"
    web_server:
      sorting_group_id: grp_status
      sorting_weight: 2
    icon: "mdi:fan-alert"
    update_interval: 1s

    lambda: |-
      if (id(orcon_fan_failure).state) {
        return {"Error"};
      }

      if (id(orcon_humidity_boost_active)) {
        return {"Humidity Boost"};
      }

      if (id(orcon_humidity_post_min) > 0.0) {
        return {"Na boost"};
      }

      return {"OK"};

  # v6: statustekst met uitleg
  - platform: template
    name: "Orcon_Status_Info"
    web_server:
      sorting_group_id: grp_status
      sorting_weight: 0
    icon: "mdi:information-outline"
    update_interval: 2s
    lambda: |-
      char b[110];
      if (id(orcon_fan_failure).state) {
        return std::string("STORING: ventilator draait niet (tacho te laag)");
      }
      if (id(orcon_remote_override) > 0) {
        snprintf(b, sizeof(b), "Afstandsbediening stand %d - ventilator %d%%", id(orcon_remote_stand), id(orcon_remote_override));
        return std::string(b);
      }
      if (id(orcon_boost_15m).is_running()) {
        return std::string("Handmatige boost");
      }
      if (id(orcon_humidity_boost_active)) {
        int s = id(orcon_humidity_boost_seconds);
        int mx = (int) (id(orcon_humidity_max_boost_minutes).state * 60) - s;
        int mn = (int) (id(orcon_humidity_min_boost_minutes).state * 60) - s;
        if (mn > 0) {
          snprintf(b, sizeof(b), "Vochtboost (douche) - minimaal nog %d min, max nog %d min", (mn + 59) / 60, (mx + 59) / 60);
        } else {
          snprintf(b, sizeof(b), "Vochtboost (douche) - stopt onder %.0f%%, max nog %d min",
                   id(orcon_humidity_baseline) + id(orcon_humidity_boost_stop).state, (mx + 59) / 60);
        }
        return std::string(b);
      }
      if (id(orcon_humidity_post_min) > 0.0) {
        snprintf(b, sizeof(b), "Na boost - laagste %.1f%%, nieuwe boost bij %.1f%%",
                 id(orcon_humidity_post_min), id(orcon_humidity_post_min) + id(orcon_humidity_rise_restart).state);
        return std::string(b);
      }
      if (id(orcon_humidity_baseline) < 0.0) {
        return std::string("Opstarten...");
      }
      if (id(orcon_night_active)) {
        snprintf(b, sizeof(b), "OK - nachtstand %d%%, boost bij %.1f%%", (int) id(orcon_night_speed).state,
                 id(orcon_humidity_baseline) + id(orcon_humidity_rise_start).state);
        return std::string(b);
      }
      snprintf(b, sizeof(b), "OK - boost bij %.1f%%", id(orcon_humidity_baseline) + id(orcon_humidity_rise_start).state);
      return std::string(b);

  # v7: stand van de afstandsbediening
  - platform: template
    name: "Orcon_Remote_Stand"
    web_server:
      sorting_group_id: grp_status
      sorting_weight: 2
    icon: "mdi:remote"
    update_interval: 2s
    lambda: |-
      int st = id(orcon_remote_stand);
      std::string t;
      if (st == 0) t = (fabs(id(orcon_remote_auto_us).state - id(orcon_remote_afwezig_us).state) < 0.5) ? "Auto/Afwezig" : "Auto";
      else if (st == 4) t = "Afwezig";
      else if (st == 1) t = "1";
      else if (st == 2) t = "2";
      else if (st == 3) t = "3/Timer";
      else t = "Onbekend";
      if (id(orcon_remote_override) > 0) {
        t += " (ESP volgt: " + to_string(id(orcon_remote_override)) + "%)";
      }
      return t;
