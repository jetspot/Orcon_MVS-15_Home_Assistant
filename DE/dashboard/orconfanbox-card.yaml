type: grid
columns: 3
square: false
cards:
  - type: vertical-stack
    cards:
      - type: heading
        heading: Lüftersteuerung
        icon: mdi:fan
      - type: entities
        show_header_toggle: false
        entities:
          - entity: fan.orconfanbox_orcon_fan_speed
            name: Lüftergeschwindigkeit
            card_mod:
              style: |
                :host {
                  --state-icon-active-color: var(--state-switch-active-color);
                }
          - entity: switch.orconfanbox_orcon_fan_bypass
            name: Bypass
          - entity: button.orconfanbox_orcon_fan_low
            name: Niedrig
          - entity: button.orconfanbox_orcon_fan_medium
            name: Mittel
          - entity: button.orconfanbox_orcon_fan_high
            name: Hoch
          - entity: button.orconfanbox_orcon_fan_boost_15_minutes
            name: Boost starten
          - entity: number.orconfanbox_orcon_fan_boost_minutes
            name: Boostdauer
          - entity: button.orconfanbox_orcon_fan_boost_cancel
            name: Boost abbrechen
  - type: vertical-stack
    cards:
      - type: heading
        heading: Automatische Feuchteregelung
        icon: mdi:water-percent
      - type: entities
        show_header_toggle: false
        entities:
          - entity: switch.orconfanbox_orcon_humidity_automatic
            name: Automatische Feuchteregelung
            icon: mdi:water-percent
          - entity: number.orconfanbox_orcon_humidity_start
            name: Einschaltschwelle
          - entity: number.orconfanbox_orcon_humidity_stop
            name: Ausschaltschwelle
          - entity: number.orconfanbox_orcon_humidity_fan_speed
            name: Lüfterstufe bei Feuchte
      - type: tile
        entity: sensor.orconfanbox_orcon_fan_tacho
        name: Tatsächliche Drehzahl
        icon: mdi:speedometer
        vertical: false
        hide_state: false
      - type: tile
        entity: sensor.orconfanbox_orcon_fan_percentage
        name: Aktuelle Lüfterstufe
        icon: mdi:percent-circle-outline
        vertical: false
        hide_state: false
      - type: tile
        entity: sensor.orconfanbox_orcon_fan_status
        name: Lüfterstatus
        icon: mdi:fan-alert
        vertical: false
        hide_state: false
  - type: vertical-stack
    cards:
      - type: heading
        heading: Luftmesswerte
        icon: mdi:home-thermometer-outline
      - type: entities
        entities:
          - entity: sensor.orconfanbox_orcon_air_temp
            name: Temperatur
          - entity: sensor.orconfanbox_orcon_air_humidity
            name: Luftfeuchtigkeit
          - entity: sensor.orconfanbox_orcon_air_pressure
            name: Luftdruck
      - type: tile
        entity: sensor.orconfanbox_orcon_fan_speed_requested
        name: Angeforderte Geschwindigkeit
        icon: mdi:remote
        vertical: false
        hide_state: false
      - type: tile
        entity: update.orconfanbox_firmware
        name: Firmware
        icon: mdi:update
        vertical: false
        hide_state: false
